<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .container {
            margin-top: 100px;
        }

        .btn {
            display: inline-block;
            margin: 15px;
            padding: 15px 25px;
            background: #00c6ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn:hover {
            background: #0072ff;
        }
    </style>
</head>

<body>

<div class="navbar">
    Admin Dashboard
</div>

<div class="container">
    <a href="/post_resource" class="btn">Post Resource</a>
    <a href="/view_resources" class="btn">View Resources</a>

</div>

</body>
</html>
