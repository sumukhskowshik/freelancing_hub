<!DOCTYPE html>
<html>
<head>
    <title>Post Resource</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3') no-repeat center center/cover;
            color: white;
        }

        .overlay {
            background: rgba(0,0,0,0.7);
            min-height: 100vh;
        }

        /* ✅ SAME NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.9);
        }

        .logo {
            color: #00c6ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            padding: 8px 14px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #00c6ff;
            color: black;
        }

        .active {
            background: #ff4d4d;
        }

        /* FORM */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
        }

        .form-container {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 15px;
            color: black;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .form-container h2 {
            text-align: center;
            color: #00c6ff;
            margin-bottom: 25px;
        }

        .form-container input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            color: black;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #00a8dd;
        }

    </style>
</head>

<body>

<div class="overlay">

    <!-- ✅ NAVBAR -->
    <div class="navbar">

        <div class="logo">
            Freelancing Hub
        </div>

        <div class="nav-links">
            <a href="/post_resource" class="active">Post Resource</a>
            <a href="/view_resources">View Resources</a>
            <a href="/logout">Logout</a>
        </div>

    </div>

    <!-- ✅ FORM -->
    <div class="main-container">

        <div class="form-container">

            <h2>Post New Resource</h2>

            <form method="POST" enctype="multipart/form-data">

                <input type="text"
                       name="title"
                       placeholder="Enter title"
                       required>

                <input type="text"
                       name="skills"
                       placeholder="Enter skills"
                       required>

                <input type="file"
                       name="video"
                       accept="video/*"
                       required>

                <button type="submit" class="btn">
                    Upload Resource
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
