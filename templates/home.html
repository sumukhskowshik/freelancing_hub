<!DOCTYPE html>
<html>
<head>
    <title>Freelancing Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Background Image */
            background: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') no-repeat center center/cover;
            height: 100vh;
            color: white;
        }

        /* Overlay for dark effect */
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            height: 100%;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
        }

        /* Center content */
        .center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80%;
            text-align: center;
        }

        .title {
            font-size: 50px;
            font-weight: bold;
        }

        .tagline {
            margin-top: 10px;
            font-size: 20px;
            color: #ddd;
        }
    </style>

</head>

<body>

<div class="overlay">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">Freelancing Hub</div>

        <div class="nav">
            <a href="/login">Login</a>
            <a href="/signup">Signup</a>
        </div>
    </div>

    <!-- Center Content -->
    <div class="center">
        <div class="title">Freelancing Hub</div>
        <div class="tagline">
            Connect with talented freelancers and get your work done efficiently.
        </div>
    </div>

</div>

</body>
</html>
